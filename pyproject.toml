[project]
name = "fraud-detection"
version = "1.0.0"
description = "Pipeline de MLOps para detección de fraude en seguros vehiculares — Universidad de Medellín"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Andres Felipe Londoño Ocampo" },
    { name = "Jhonatan Caro Atehortúa" },
    { name = "Paulina Perez Ramirez" },
    { name = "Victor Manuel Galeano Alvarez" },
]
license = { text = "MIT" }
keywords = ["mlops", "machine-learning", "fraud-detection", "prefect", "mlflow"]

dependencies = [
    # Core científico
    "pandas>=2.2,<3.0",
    "numpy>=2.1,<3.0",
    "scikit-learn>=1.5,<2.0",
    # Modelado
    "xgboost>=2.1",
    "imbalanced-learn>=0.13",
    # Orquestación y seguimiento de experimentos
    "prefect>=3.0,<4.0",
    "mlflow>=2.16,<4.0",
    # Servicio de predicción
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Visualización e interpretabilidad
    "plotly>=5.17",
    "shap>=0.46",
    # Aplicación web de exploración
    "streamlit>=1.28",
    # Persistencia y utilidades
    "joblib>=1.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.1.0",
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "nbformat>=5.9",
]

[project.urls]
Repository = "https://github.com/Jhonatan0828/fraudes_en_seguros_veh"

# --------------------------------------------------------------
# Configuración del paquete
# --------------------------------------------------------------
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "flows*"]

# --------------------------------------------------------------
# Configuración de pytest
# --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

# --------------------------------------------------------------
# Configuración de ruff (linter)
# --------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
